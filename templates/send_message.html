<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Messages - WhatsApp Business</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Include same sidebar as dashboard -->
            <div class="col-md-2 sidebar p-0">
                <!-- Sidebar content (same as dashboard) -->
            </div>
            
            <div class="col-md-10 main-content p-4">
                <h2 class="mb-4">Send Messages</h2>
                
                <!-- Single Message -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Send Single Message</h5>
                    </div>
                    <div class="card-body">
                        <form id="singleMessageForm">
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number (with country code)</label>
                                <input type="text" class="form-control" id="phone" placeholder="+1234567890" required>
                            </div>
                            <div class="mb-3">
                                <label for="messageTemplate" class="form-label">Select Template (Optional)</label>
                                <select class="form-select" id="messageTemplate" onchange="useTemplate()">
                                    <option value="">Choose template or type custom message</option>
                                    {% for template in templates %}
                                    <option value="{{ template.id }}" data-content="{{ template.content }}">
                                        {{ template.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="4" required></textarea>
                                <div class="form-text">You can use {name} as placeholder for contact name</div>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> Send Message
                            </button>
                        </form>
                        <div id="singleResult" class="mt-3"></div>
                    </div>
                </div>
                
                <!-- Bulk Message -->
                <div class="card">
                    <div class="card-header">
                        <h5>Send Bulk Messages</h5>
                    </div>
                    <div class="card-body">
                        <form id="bulkMessageForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="bulkFile" class="form-label">Upload Contacts File (CSV/Excel)</label>
                                <input type="file" class="form-control" id="bulkFile" accept=".csv,.xlsx,.xls" required>
                                <div class="form-text">
                                    File should have a column named 'phone', 'phone_number', or 'mobile'
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="bulkTemplate" class="form-label">Select Template</label>
                                <select class="form-select" id="bulkTemplate" name="template_id">
                                    <option value="">Choose template or type custom message</option>
                                    {% for template in templates %}
                                    <option value="{{ template.id }}">{{ template.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="bulkMessage" class="form-label">Message (if not using template)</label>
                                <textarea class="form-control" id="bulkMessage" rows="4"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send-fill"></i> Start Sending
                            </button>
                        </form>
                        <div id="bulkResult" class="mt-3"></div>
                        <div class="progress mt-3" style="display:none;" id="bulkProgress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function useTemplate() {
            const select = document.getElementById('messageTemplate');
            const textarea = document.getElementById('message');
            const selectedOption = select.options[select.selectedIndex];
            
            if (selectedOption.value) {
                textarea.value = selectedOption.dataset.content;
            }
        }
        
        document.getElementById('singleMessageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('phone', document.getElementById('phone').value);
            formData.append('message', document.getElementById('message').value);
            
            try {
                const response = await fetch('/send-message/single', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                const resultDiv = document.getElementById('singleResult');
                
                if (data.status === 'success') {
                    resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (error) {
                document.getElementById('singleResult').innerHTML = 
                    `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
        
        document.getElementById('bulkMessageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const progressDiv = document.getElementById('bulkProgress');
            progressDiv.style.display = 'block';
            
            try {
                const response = await fetch('/send-message/bulk', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                progressDiv.style.display = 'none';
                
                const resultDiv = document.getElementById('bulkResult');
                if (data.status === 'success') {
                    resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (error) {
                progressDiv.style.display = 'none';
                document.getElementById('bulkResult').innerHTML = 
                    `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
